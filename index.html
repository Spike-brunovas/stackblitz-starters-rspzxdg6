<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Matemática</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="container">

    <header class="header">
      <span class="tag">MATEMÁTICA</span>

      <h1>Calculadora Matemática</h1>

      <p>
        Calcule expressões e visualize funções matemáticas.
      </p>
    </header>

    <section class="card calculator-card">

      <div class="card-title">
        <div>
          <h2>Calculadora</h2>
        </div>

        <span class="icon">∑</span>
      </div>

      <label for="tipoCalculo">
        Escolha o cálculo
      </label>

      <select id="tipoCalculo">

        <optgroup label="Operações básicas">
          <option value="soma">Somar (+)</option>
          <option value="subtracao">Subtrair (-)</option>
          <option value="multiplicacao">Multiplicar (×)</option>
          <option value="divisao">Dividir (÷)</option>
        </optgroup>

        <optgroup label="Funções matemáticas">
          <option value="exponencial">Função Exponencial</option>
          <option value="logaritmo">Função Logarítmica</option>
          <option value="quadratica">Função Quadrática</option>
          <option value="raiz">Raiz Quadrada</option>
        </optgroup>

      </select>

      <div id="formula" class="formula">
        Operação: a + b
      </div>

      <div id="campos" class="campos">

        <div class="campo">
          <label for="numero1">Primeiro número</label>
          <input type="number" id="numero1" placeholder="Digite um número">
        </div>

        <div class="campo">
          <label for="numero2">Segundo número</label>
          <input type="number" id="numero2" placeholder="Digite um número">
        </div>

      </div>

      <button id="calcular">
        Calcular
      </button>

      <div id="resultado" class="resultado">
        Resultado aparecerá aqui
      </div>

    </section>

    <section class="card graph-card">

      <div class="card-title">
        <div>
          <h2>Gráfico da Função</h2>
          <p>Visualize o comportamento da função.</p>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="grafico"></canvas>
      </div>

    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>

</body>

</html>
